{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MediaFlow{% endblock %}</title><link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <nav><a class="brand" href="{% url 'home' %}">MediaFlow</a><span class="spacer"></span>{% if user.is_authenticated %}<span>{{ user.username }}</span><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="link">Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a>{% endif %}</nav>
  <main>{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body>
</html>
