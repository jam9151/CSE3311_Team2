{% extends "base.html" %}
{% block title %}Review {{ item.title }} · MediaFlow{% endblock %}

{% block content %}
<section class="mx-auto max-w-md">
  <span class="tag tag-{{ item.media_type }}">{{ item.get_media_type_display }}</span>
  <h1 class="mt-1 mb-6 font-display text-4xl leading-tight">How was {{ item.title }}?</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex items-baseline gap-5 pt-2">
      <button class="btn">Save review</button>
      <a class="text-sm text-muted" href="{% url 'reviews' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
