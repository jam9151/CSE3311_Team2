{% extends "base.html" %}
{% block title %}{{ heading }} · MediaFlow{% endblock %}

{% block content %}
<section class="card mx-auto my-8 max-w-md">
  <h1 class="mb-4 text-2xl font-bold tracking-tight">{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-2">
      <button class="btn">Save</button>
      <a class="btn btn-ghost" href="{% url cancel_url %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
