{% extends "base.html" %}
{% block title %}{{ heading }} · MediaFlow{% endblock %}

{% block content %}
<section class="mx-auto max-w-md">
  <h1 class="mb-6 font-display text-4xl leading-tight">{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex items-baseline gap-5 pt-2">
      <button class="btn">Save</button>
      <a class="text-sm text-muted" href="{% url cancel_url %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
