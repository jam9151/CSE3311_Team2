{% extends "base.html" %}
{% block title %}Forgot your password · MediaFlow{% endblock %}

{% block content %}
<section class="card mx-auto my-8 max-w-md">
  <p class="eyebrow">Account</p>
  <h1 class="text-2xl font-bold tracking-tight">Forgot your password?</h1>
  <p class="mb-5 mt-2 text-sm text-muted">
    Enter the email you signed up with and we'll send a link to choose a new one.
  </p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Send me a link</button>
  </form>
  <p class="mt-4 text-sm text-muted">Remembered it? <a href="{% url 'login' %}">Sign in</a>.</p>
</section>
{% endblock %}
