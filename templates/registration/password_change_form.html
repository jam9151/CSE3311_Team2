{% extends "base.html" %}
{% block title %}Change password · MediaFlow{% endblock %}

{% block content %}
<section class="card mx-auto my-8 max-w-md">
  <p class="eyebrow">Account</p>
  <h1 class="text-2xl font-bold tracking-tight">Change your password</h1>
  <form class="mt-5" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-2">
      <button class="btn">Change password</button>
      <a class="btn btn-ghost" href="{% url 'dashboard' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
