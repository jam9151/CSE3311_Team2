{% extends "base.html" %}
{% block title %}Sign in · MediaFlow{% endblock %}

{% block content %}
<section class="mx-auto max-w-sm pt-6">
  <h1 class="mb-6 font-display text-5xl leading-none">Welcome back.</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn w-full justify-center">Sign in</button>
  </form>
  <p class="mt-6 text-sm text-muted">New here? <a href="{% url 'register' %}">Make an account</a>.</p>
</section>
{% endblock %}
