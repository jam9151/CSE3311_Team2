{% extends "base.html" %}
{% block title %}Sign in · MediaFlow{% endblock %}

{% block content %}
<section class="card mx-auto my-8 max-w-md">
  <h1 class="mb-4 text-2xl font-bold tracking-tight">Welcome back</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Sign in</button>
  </form>
  <p class="mt-4 text-sm text-muted">New here? <a href="{% url 'register' %}">Create an account</a>.</p>
</section>
{% endblock %}
