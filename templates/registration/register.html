{% extends "base.html" %}
{% block title %}Sign up · MediaFlow{% endblock %}

{% block content %}
<section class="mx-auto max-w-sm pt-6">
  <h1 class="font-display text-5xl leading-none">Make an account.</h1>
  <p class="mt-2 mb-6 text-sm text-muted">UTA students only, so you'll need your @mavs.uta.edu address.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn w-full justify-center">Create account</button>
  </form>
  <p class="mt-6 text-sm text-muted">Already signed up? <a href="{% url 'login' %}">Sign in</a>.</p>
</section>
{% endblock %}
